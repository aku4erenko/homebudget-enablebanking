<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeBudget Enable Banking Callback</title>
<style>
  body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f7f7f5; color: #191a1b; }
  main { max-width: 720px; margin: 40px auto; padding: 24px; background: #fff; border: 1px solid #e0e0e0; }
  h1 { margin-top: 0; }
  label { display: block; font-weight: 600; margin-top: 16px; }
  code { display: block; padding: 12px; background: #f1f3f5; border: 1px solid #d0d7de; word-break: break-word; }
  .muted { color: #666; }
  .error { color: #b00020; }
</style>
<main>
  <h1>HomeBudget Bank Authorization</h1>
  <p class="muted">This page displays the Enable Banking authorization result. Copy the code into the local session exchange step.</p>
  <p id="status"></p>
  <label>Authorization code</label>
  <code id="code"></code>
  <label>State</label>
  <code id="state"></code>
  <label>Error</label>
  <code id="error"></code>
</main>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code") || "";
  const state = params.get("state") || "";
  const error = params.get("error") || params.get("error_description") || "";
  document.getElementById("code").textContent = code || "No code parameter found.";
  document.getElementById("state").textContent = state || "No state parameter found.";
  document.getElementById("error").textContent = error || "No error.";
  document.getElementById("status").className = error ? "error" : "";
  document.getElementById("status").textContent = error ? "Authorization returned an error." : "Authorization return received.";
</script>
